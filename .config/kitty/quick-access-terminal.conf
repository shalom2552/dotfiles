# Pass kitty.conf options through (can be repeated)
kitty_override shell zsh
# kitty_override font_size 11

# Size & position
# edge: top | bottom | left | right | center | background ...
edge top
# lines = height (top/bottom edge), columns = width (left/right edge)
lines 30
columns 80
margin_top 0
margin_bottom 0
margin_left 400
margin_right 400

# Look & behavior
background_opacity 0.95
# auto-hide when you click elsewhere
hide_on_focus_loss no
grab_keyboard no
start_as_hidden no
# focus_policy: exclusive | on-demand | not-allowed
focus_policy on-demand
# output_name DP-1
app_id kitty-quick-access

kitty_override draw_window_borders_for_single_window yes
kitty_override draw_minimal_borders no
kitty_override window_border_width 1px
kitty_override window_border_radius 10px
kitty_override window_padding_width 10

