[mgr]
show_hidden = true
ratio = [1, 2, 3]   # panes size ratio
linemode = "size"

# show git status for files
[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
group = "normal"
run = "git"

# show git status for directories
[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
group = "normal"
run = "git"

