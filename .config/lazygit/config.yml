# Only overrides live here. Commented lines show defaults for quick reference.
# Full list: `lazygit --config` or
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

os:
  open: 'gio open {{filename}}'       # xdg-open on bare WMs runs nvim in lazygit's tty and freezes
  # editPreset: ""                    # nvim | nvim-remote | vscode | ...; empty = guess from $EDITOR
  # Don't set editInTerminal: it overrides the preset and breaks 'e'.

gui:
  theme:
    selectedLineBgColor:
      - '#2e3c64'
    # activeBorderColor: [green, bold]
    # inactiveBorderColor: [default]
    # optionsTextColor: [blue]
    # unstagedChangesColor: [red]
  spinner:
    frames: ['◜', '◠', '◝', '◞', '◡', '◟']
    rate: 100

promptToReturnFromSubprocess: false

  # nerdFontsVersion: ""              # '2' | '3' | "" (no icons)
  # border: rounded                   # rounded | single | double | hidden | bold
  # sidePanelWidth: 0.3333            # 0 to 1.0
  # expandFocusedSidePanel: false     # accordion effect on focused side panel
  # mainPanelSplitMode: flexible      # horizontal | vertical | flexible
  # screenMode: normal                # normal | half | full
  # portraitMode: auto                # auto | always | never
  # showFileTree: true                # toggle in app with `
  # showNumstatInFilesView: false     # lines changed per file
  # showRandomTip: true
  # showCommandLog: true
  # commandLogSize: 8
  # showBottomLine: true
  # showDivergenceFromBaseBranch: none  # none | onlyArrow | arrowAndNumber
  # filterMode: substring             # substring | fuzzy
  # timeFormat: 02 Jan 06             # Go time format
  # shortTimeFormat: 3:04PM
  # mouseEvents: true
  # animateExplosion: true
  # skipDiscardChangeWarning: false
  # skipStashWarning: false

# git:
  # diffRenderers:                    # external pagers, cycle with |
  #   - pager: delta --dark --paging=never
  #   - externalDiffCommand: difft --color=always
  # autoFetch: true
  # fetchAll: true
  # autoForwardBranches: onlyMainBranches  # none | onlyMainBranches | allBranches
  # mainBranches: [master, main]
  # disableForcePushing: false
  # commit:
  #   signOff: false
  #   autoWrapCommitMessage: true
  #   autoWrapWidth: 72
  # merging:
  #   args: ""                        # e.g. --no-ff
  # log:
  #   order: topo-order               # date-order | author-date-order | topo-order | default
  #   showGraph: always               # always | never | when-maximised
  # branchPrefix: ""
  # parseEmoji: false

# update:
  # method: prompt                    # prompt | background | never
  # days: 14

# confirmOnQuit: false
# quitOnTopLevelReturn: false         # esc at top level quits
# disableStartupPopups: false
# notARepository: prompt              # prompt | create | skip | quit

# customCommands:
#   https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Command_Keybindings.md
#   - key: <c-p>
#     context: global
#     command: git push --force-with-lease
#     description: force push with lease

# keybinding:
  # Defaults: https://github.com/jesseduffield/lazygit/blob/master/docs/keybindings/Keybindings_en.md
  # Each binding is a key or a list of keys, e.g. quit: [q, <ctrl+c>]
  # universal:
  #   quit: q
  #   edit: e
  #   openFile: o
  #   refresh: R
  #   undo: z
  #   redo: Z
  #   pushFiles: P
  #   pullFiles: p
  #   nextScreenMode: +
  #   prevScreenMode: _
